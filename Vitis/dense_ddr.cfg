# ----------------------------------------------------------------------------
# dense_ddr.cfg -- the DENSE GEMV baseline on DDR4 instead of HBM (§7.2).
#
# IDENTICAL to dense_hbm.cfg except for the sp= lines. Verify that with:
#
#   diff <(grep -v '^#' dense_hbm.cfg) <(grep -v '^#' dense_ddr.cfg)
#
# and the ONLY differences should be HBM[n] -> DDR[0|1]. Nothing else may move:
# no RTL, no HLS, no host code (host.cpp creates plain cl::Buffer with no
# cl_mem_ext_ptr_t, so XRT takes placement from the xclbin), same .xo files,
# same --kernel_frequency 300, same config stack. One variable.
#
# BANK SPLIT. 14 streams onto 2 banks, balanced 7/7 by stream count. Reads and
# writes deliberately share both banks rather than being segregated: aggregate
# bandwidth matters more than read/write turnaround here, and putting all 10
# reads on one controller would cap them at ~19.2 GB/s.
#
# THE PREDICTION. Dense wants 8 x 32 B x 300 MHz = 76.8 GB/s of input; two
# DDR4-2400 banks supply roughly 38.4 GB/s -- about 50% of demand. Dense should
# therefore lose LESS than sparse does (sparse needs 105.6 GB/s, ~36% supplied),
# which is the whole point: on DDR the two designs are compared as BYTE movers
# rather than as BEAT consumers.
#
# Used as:  v++ -l --config dense_ddr.cfg --kernel_frequency 300 ...
#   -- dense_hbm.cfg is the ONLY config the measured dense build used; do not
#      add impl_opt.cfg here (see INTEGRATION_STEPS S19).
# ----------------------------------------------------------------------------

[connectivity]

# ---- compute units (unchanged from dense_hbm.cfg) --------------------------
nk=krnl_mm2s:10:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_w6.mm2s_w7.mm2s_a0.mm2s_a1
nk=krnl_gemv_dense:1:gemv
nk=krnl_s2mm:4:s2mm_c0.s2mm_c1.s2mm_c2.s2mm_c3

# ---- memory mapping: THE ONLY THING THAT DIFFERS FROM THE HBM BUILD --------
# DDR[0]: 4 weights + 1 activation + 2 outputs = 7 streams
sp=mm2s_w0.in:DDR[0]
sp=mm2s_w1.in:DDR[0]
sp=mm2s_w2.in:DDR[0]
sp=mm2s_w3.in:DDR[0]
sp=mm2s_a0.in:DDR[0]
sp=s2mm_c0.out:DDR[0]
sp=s2mm_c1.out:DDR[0]

# DDR[1]: 4 weights + 1 activation + 2 outputs = 7 streams
sp=mm2s_w4.in:DDR[1]
sp=mm2s_w5.in:DDR[1]
sp=mm2s_w6.in:DDR[1]
sp=mm2s_w7.in:DDR[1]
sp=mm2s_a1.in:DDR[1]
sp=s2mm_c2.out:DDR[1]
sp=s2mm_c3.out:DDR[1]

# ---- kernel-to-kernel streams (byte-identical to dense_hbm.cfg) ------------
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5
stream_connect=mm2s_w6.out:gemv.s_axis_w6
stream_connect=mm2s_w7.out:gemv.s_axis_w7

stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in
stream_connect=gemv.m_axis_c3:s2mm_c3.in
