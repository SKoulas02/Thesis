# --------------------------------------------------------------------------
# slr_floorplan_4x4_x2.cfg -- every compute unit in SLR0.
#
# THE DEFAULT, for the same reason it is the default at 4x4: a single
# tenant measured WORSE when split (WNS -0.048 with the engine in SLR1,
# +0.022 with everything in SLR0 -- the SLR crossing cost 0.222 ns on a
# ONE-LUT path). Keep every tenant whole, beside its own movers.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   2 x movers    168 BRAM  (5 mm2s + 1 s2mm per tenant, measured)
#   2 x engine     62 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 260 of SLR0's 672 tiles = 39%
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

[connectivity]

# tenant 0
slr=gemv_t0:SLR0
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=mm2s_a0_t0:SLR0
slr=mm2s_a1_t0:SLR0
slr=s2mm_c0_t0:SLR0

# tenant 1
slr=gemv_t1:SLR0
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=mm2s_a0_t1:SLR0
slr=mm2s_a1_t1:SLR0
slr=s2mm_c0_t1:SLR0
