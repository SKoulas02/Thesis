# ----------------------------------------------------------------------------
# sparse_hbm.cfg -- link configuration for the 2:M SPARSE GEMV system on HBM.
#
#   13 x krnl_mm2s  ->  krnl_gemv_sparse (free-running)  ->  4 x krnl_s2mm
#
# 17 HBM pseudo-channels: 8 weights + 3 indices + 2 activations in, 4 results
# out. Three more input channels than dense -- that index traffic is exactly
# the interface cost of sparsity, and it is a headline number for 7.1: sparse
# moves 21 input PCs' worth of bits per beat against dense's 16, a 31% per-beat
# overhead, against a 2/M reduction in beats.
#
# SAME MOVER KERNELS AS DENSE. krnl_mm2s / krnl_s2mm are unchanged and are not
# rebuilt -- an index PC is just another 256-bit stream to them. Only the count
# changes (10 -> 13).
#
# THE SPARSITY CODE IS NOT A STREAM. The 2-bit code rides in index PC2's
# padding, bits [641:640] of the joined 768-bit index word (= ind_pc2 bits
# [129:128]). It is buffer CONTENT written by the Python packer; no mover, no
# link line and no host argument knows about it.
#
# THIS FILE IS THE ENTIRE HBM-vs-DDR EXPERIMENT (INTEGRATION_PLAN.md 7.2).
# Swapping HBM[n] for DDR[0] changes the memory system without touching one
# line of RTL or one line of host code.
#
# Used as:  v++ -l --config sparse_hbm.cfg ...
# ----------------------------------------------------------------------------

[connectivity]

# ---- compute units ---------------------------------------------------------
# Names are given explicitly. Without them every sp= and stream_connect= below
# would address krnl_mm2s_1 .. krnl_mm2s_13 by position, and one transposed
# digit would silently bind an index channel to a weight stream -- wrong
# answers, no error. With 13 identical movers this matters more than it did at
# 10: the index and weight streams are indistinguishable at link level and only
# the names keep them apart.
nk=krnl_mm2s:13:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_w6.mm2s_w7.mm2s_i0.mm2s_i1.mm2s_i2.mm2s_a0.mm2s_a1
nk=krnl_gemv_sparse:1:gemv
nk=krnl_s2mm:4:s2mm_c0.s2mm_c1.s2mm_c2.s2mm_c3

# ---- memory binding: one m_axi argument per pseudo-channel ------------------
# 'in' / 'out' are the kernel ARGUMENT names, not the bundle names.
sp=mm2s_w0.in:HBM[0]
sp=mm2s_w1.in:HBM[1]
sp=mm2s_w2.in:HBM[2]
sp=mm2s_w3.in:HBM[3]
sp=mm2s_w4.in:HBM[4]
sp=mm2s_w5.in:HBM[5]
sp=mm2s_w6.in:HBM[6]
sp=mm2s_w7.in:HBM[7]

sp=mm2s_i0.in:HBM[8]
sp=mm2s_i1.in:HBM[9]
sp=mm2s_i2.in:HBM[10]

sp=mm2s_a0.in:HBM[11]
sp=mm2s_a1.in:HBM[12]

sp=s2mm_c0.out:HBM[13]
sp=s2mm_c1.out:HBM[14]
sp=s2mm_c2.out:HBM[15]
sp=s2mm_c3.out:HBM[16]

# ---- kernel-to-kernel streams ----------------------------------------------
# Format: <producer_cu>.<out_port>:<consumer_cu>.<in_port>[:<fifo_depth>]
# The optional fifo_depth is the first thing to try if a stream stalls in
# hw_emu, and a knob for the 7.3 bandwidth work.
#
# WARNING: a mistyped port name here is a link WARNING, not an error. The
# stream is simply left dangling and the engine's barrier join waits forever
# for a channel that never arrives. If hw_emu hangs, check these first -- and
# note the sparse join waits on ALL 11 weight+index PCs, so a single dangling
# index stream hangs the whole engine with no other symptom.
#
# The port names on the gemv side are two2N_axis's entity ports, which are also
# what the RTL Kernel Wizard was configured with -- s_axis_ind0..2, not
# s_axis_i0..2. The mover CU names above are abbreviated (mm2s_i0); the kernel
# port names are not. Do not "tidy" one to match the other.
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5
stream_connect=mm2s_w6.out:gemv.s_axis_w6
stream_connect=mm2s_w7.out:gemv.s_axis_w7

stream_connect=mm2s_i0.out:gemv.s_axis_ind0
stream_connect=mm2s_i1.out:gemv.s_axis_ind1
stream_connect=mm2s_i2.out:gemv.s_axis_ind2

stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in
stream_connect=gemv.m_axis_c3:s2mm_c3.in

# ---- kernel clock ----------------------------------------------------------
# NOT SET HERE. A [clock] section maps to v++ --clock, which this platform
# rejects:
#   ERROR: [v++ 60-2308] --clock options can only be used if a platform
#                        contains fixed reference clocks
# xilinx_u280_xdma_201920_3 is a 2019.2-era platform without them. Use the
# older command-line flag instead, and only where it matters:
#
#   hw_emu : omit it entirely -- this is simulation, the clock is irrelevant
#   hw     : v++ -l ... --kernel_frequency 300
#
# 300 MHz is what dense closed at in-system (+0.022 ns). Sparse is the tighter
# design -- module-level OOC Fmax ~422 MHz against dense's >=479 -- and it now
# has 18 CUs and 17 HBM channels to route instead of 15 and 14. If the hw link
# fails timing at 300, drop to 250 and record BOTH numbers: the achievable
# system clock is itself a sparse-vs-dense result, not a build detail.
