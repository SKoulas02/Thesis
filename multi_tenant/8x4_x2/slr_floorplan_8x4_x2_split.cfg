# --------------------------------------------------------------------------
# slr_floorplan_8x4_x2_split.cfg -- the engines get SLR1.
#
# NOT THE DEFAULT at this size. Use slr_floorplan_8x4_x2.cfg (everything
# in SLR0) first and switch only if the build misses its frequency, which
# is the rule the family study followed: single die until a build fails.
#
# The 2 engines are 70,876 LUT and 90 BRAM together -- they fit one die
# easily. The movers stay in SLR0 beside the HBM they master.
# --------------------------------------------------------------------------

