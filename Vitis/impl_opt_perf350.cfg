# ----------------------------------------------------------------------------
# impl_opt_perf350.cfg -- the 350 MHz attempt.
#
# IDENTICAL to impl_opt_perf.cfg except for ONE change: a synthesis strategy that
# actually reaches a run that exists. That is deliberate -- 325 MHz closed on the
# implementation strategy and floorplan alone, so if 350 closes too, the
# synthesis strategy is the only thing that changed and gets the credit. One
# variable per experiment.
#
# ---- WHY Flow_AlternateRoutability AND NOT Flow_PerfOptimized_high ----------
# Chosen on the measured evidence, not on general reputation. The worst path in
# the 300 MHz + fanout-fix build was:
#
#     ONE LUT6, fanout 7, 3.955 ns total -- logic 0.116 ns (2.9%),
#     route 3.839 ns (97.1%)
#
# One logic level spending 97% of its time on wire is a ROUTABILITY problem.
# Flow_AlternateRoutability targets exactly that: alternate optimisation and
# mapping algorithms chosen to reduce routing congestion.
# Flow_PerfOptimized_high mainly attacks LOGIC DEPTH (one-hot FSMs, no resource
# sharing, no LUT combining), which is not the bottleneck here -- there is only
# one level of it.
#
# Secondary benefit: Flow_PerfOptimized_high's `-resource_sharing off` and
# `-no_lc` inflate LUT counts substantially, which would have forced a rebuild of
# the §7.1 AREA comparison under the same strategy. AlternateRoutability is less
# aggressive on area, so that risk is smaller -- though still worth checking the
# utilisation report afterwards rather than assuming.
#
# Flow_PerfOptimized_high is now the RESERVE lever, not the discarded one. If
# 350 fails on routability grounds, logic depth is the next thing to try.
#
# Used as:
#   v++ -l --config <design>_hbm.cfg --config impl_opt_perf350.cfg \
#          --config slr_floorplan[_dense].cfg --kernel_frequency 350 ...
#
# ---- WHY THE EXTRA SYNTH LINE ----------------------------------------------
# In the 325 MHz builds `prop=run.synth_1.strategy=...` was SILENTLY IGNORED.
# `v++ -l` builds the dynamic region as a DFX reconfigurable module, so the
# Vivado runs are `my_rm_synth_1` and `impl_1`. A property addressed to a run
# that does not exist matches nothing and produces NO warning. Proof, read out of
# _x/logs/link/vivado.log:
#
#     synth_design -top pfm_dynamic -part xcu280-fsvh2892-2L-e -mode out_of_context
#
# -- no -directive, no -fsm_extraction, no -keep_equivalent_registers. Meanwhile
# `-directive Explore` x4 and `-directive AggressiveExplore` x1 confirm the
# run.impl_1.* properties DID apply.
#
# Both spellings are given below. An unmatched property is harmless, so covering
# both costs nothing and guards against the run being named differently in the
# dense and sparse flows.
#
# STRATEGY NAMES VERIFIED PRESENT IN VIVADO 2021.1 via
# `list_property_value strategy [get_runs synth_1]` / `[get_runs impl_1]`:
# Flow_AlternateRoutability, Flow_PerfOptimized_high and
# Performance_ExplorePostRoutePhysOpt are all in the lists. The names were never
# the problem -- the RUN name was.
#
# ---- VERIFY IT LANDED, DO NOT ASSUME ---------------------------------------
# Absence of an error is NOT evidence a --vivado.prop applied. After the build:
#
#   grep -oE "synth_design [^\"]*" _x/logs/link/vivado.log | head -2
#   grep -oE "\-directive [A-Za-z_]+" _x/logs/link/vivado.log | sort | uniq -c
#
# Want to see `-directive AlternateRoutability` on the synth_design line. In the
# 325 MHz builds that line was bare:
#     synth_design -top pfm_dynamic -part xcu280-fsvh2892-2L-e -mode out_of_context
# If it is bare AGAIN, the run name is still wrong, 350 was reached (or missed) on
# the implementation side alone, and it must be written up that way. Check this
# ~20 minutes in rather than after five hours.
#
# ---- IF THIS IS NOT ENOUGH -------------------------------------------------
# Next lever, the one this build set aside:
#     prop=run.my_rm_synth_1.strategy=Flow_PerfOptimized_high
# It attacks logic depth instead of routability. Cheap to swap -- one line.
#
# Also unspent, all confirmed available in 2021.1: Performance_Retiming (moves
# registers across logic; the critical path has been an HLS mover's FSM),
# Performance_BalanceSLLs / Performance_SpreadSLLs /
# Congestion_SSI_SpreadLogic_high (SSI-specific, partly redundant with the
# explicit slr= floorplan).
#
# ---- TWO WARNINGS ----------------------------------------------------------
# ⚠️ AREA. Any synthesis strategy can shift LUT counts. AlternateRoutability is
# milder than PerfOptimized_high in this respect, but CHECK rather than assume:
# if 350 becomes the headline, compare its utilisation against the 325 build, and
# if the counts moved materially the §7.1 AREA comparison must be rebuilt with
# BOTH designs under the same strategy. At 300/325 no synthesis strategy applied
# at all, so those area numbers are unaffected and remain comparable.
#
# ⚠️ 350 MHz = 2.857 ns, and both designs closed 325 at ~zero margin (+0.013
# dense, +0.001 sparse). This asks for another ~219 ps. It may well fail. That is
# a legitimate outcome -- but note a FAILED run's WNS is only a rough estimate of
# the ceiling, not a measurement of it. Measured counterexample on this design: a
# 300 MHz target achieved 3.813 ns while a 250 MHz target achieved 4.177 ns.
# Fmax is only established by a constraint that CLOSES.
# ----------------------------------------------------------------------------

[vivado]

# ---- synthesis: both run spellings, only one will match --------------------
prop=run.my_rm_synth_1.strategy=Flow_AlternateRoutability
prop=run.synth_1.strategy=Flow_AlternateRoutability

# ---- implementation: UNCHANGED from the 325 MHz build ----------------------
prop=run.impl_1.strategy=Performance_ExplorePostRoutePhysOpt
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
