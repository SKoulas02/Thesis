# --------------------------------------------------------------------------
# sparse_hbm_4x4_x2.cfg -- 2 INDEPENDENT 4x4 tenants on one U280.
#
# GENERATED by multi_tenant/make_multi_build.py. Tenant k = one complete
# 4x4 engine (4 cores x 4 blocks, 128 DSPs) with its own matrix, its own
# sparsity mode and its own 6 HBM pseudo-channels HBM[6*k .. 6*k+5].
#
# 2 tenants  ->  12 of 32 HBM channels, 12 mover CUs + 2 engines = 14 CUs.
#
# THE ENGINE .xo IS UNCHANGED. This is the same krnl_gemv_sparse_4x4.xo that
# closed at 400 MHz as a single tenant, instantiated 2 times.
#
# NOTHING IS SHARED BETWEEN TENANTS except the card, HBM and the kernel
# clock. No stream crosses from one tenant to another; a cross-wired
# stream_connect would show up immediately because every tenant runs a
# DIFFERENT matrix and is compared against its own golden.
#
# Used as:  v++ -l --config sparse_hbm_4x4_x2.cfg --config impl_family.cfg \
#                  --config slr_floorplan_4x4_x2.cfg --kernel_frequency 400 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ----------------------------------------------------
# Names are explicit. Positional naming across 10 movers would make one
# transposed digit bind a tenant's index channel to another's weight
# stream -- wrong answers on both, no error.
nk=krnl_mm2s:10:mm2s_w0_t0.mm2s_w1_t0.mm2s_i0_t0.mm2s_a0_t0.mm2s_a1_t0.mm2s_w0_t1.mm2s_w1_t1.mm2s_i0_t1.mm2s_a0_t1.mm2s_a1_t1
nk=krnl_gemv_sparse:2:gemv_t0.gemv_t1
nk=krnl_s2mm:2:s2mm_c0_t0.s2mm_c0_t1

# ---- memory binding: tenant k owns HBM[6*k .. 6*k+5] ----------------

# tenant 0 -> HBM[0..5]
sp=mm2s_w0_t0.in:HBM[0]
sp=mm2s_w1_t0.in:HBM[1]
sp=mm2s_i0_t0.in:HBM[2]
sp=mm2s_a0_t0.in:HBM[3]
sp=mm2s_a1_t0.in:HBM[4]
sp=s2mm_c0_t0.out:HBM[5]

# tenant 1 -> HBM[6..11]
sp=mm2s_w0_t1.in:HBM[6]
sp=mm2s_w1_t1.in:HBM[7]
sp=mm2s_i0_t1.in:HBM[8]
sp=mm2s_a0_t1.in:HBM[9]
sp=mm2s_a1_t1.in:HBM[10]
sp=s2mm_c0_t1.out:HBM[11]

# ---- kernel-to-kernel streams, WITHIN each tenant ---------------------
# A mistyped port name here is a link WARNING, not an error: the stream is
# left dangling and that tenant's barrier join waits forever for a channel
# that never arrives. If one tenant hangs and the others finish, look here
# first -- its join waits on ALL 3 weight+index PCs.

# tenant 0
stream_connect=mm2s_w0_t0.out:gemv_t0.s_axis_w0
stream_connect=mm2s_w1_t0.out:gemv_t0.s_axis_w1
stream_connect=mm2s_i0_t0.out:gemv_t0.s_axis_ind0
stream_connect=mm2s_a0_t0.out:gemv_t0.s_axis_a0
stream_connect=mm2s_a1_t0.out:gemv_t0.s_axis_a1
stream_connect=gemv_t0.m_axis_c0:s2mm_c0_t0.in

# tenant 1
stream_connect=mm2s_w0_t1.out:gemv_t1.s_axis_w0
stream_connect=mm2s_w1_t1.out:gemv_t1.s_axis_w1
stream_connect=mm2s_i0_t1.out:gemv_t1.s_axis_ind0
stream_connect=mm2s_a0_t1.out:gemv_t1.s_axis_a0
stream_connect=mm2s_a1_t1.out:gemv_t1.s_axis_a1
stream_connect=gemv_t1.m_axis_c0:s2mm_c0_t1.in

# ---- kernel clock -----------------------------------------------------
# NOT SET HERE -- a [clock] section maps to v++ --clock, which this
# platform rejects. Use  v++ -l ... --kernel_frequency 400
# ONE clock for every tenant: tenants share the card, so they share the
# frequency. A tenant cannot be clocked independently of its neighbours.
