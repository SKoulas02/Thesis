# --------------------------------------------------------------------------
# sparse_hbm_4x4_x6_bcast.cfg -- 6 4x4 tenants on one U280, fed ONE activation
# vector by ONE BROADCAST MOVER PAIR.
#
# GENERATED by multi_tenant/make_bcast_build.py. Tenant k = one complete
# 4x4 engine (4 cores x 4 blocks, 128 DSPs) with its own matrix, its own
# sparsity mode and its own 4 HBM pseudo-channels HBM[2+4*k .. 2+4*k+3]
# (weights, indices, outputs). The vector: ONE copy in HBM[0] and HBM[1].
#
# 6 tenants  ->  26 of 32 HBM channels, 26 mover CUs (= 26 of the 32 HBM kernel
# ports) + 6 engines = 32 CUs. (A mover pair per tenant would need 36 ports.)
#
# THE ENGINE .xo IS UNCHANGED: krnl_gemv_sparse_4x4.xo, 400 MHz as a single
# tenant, instantiated 6 times; so are krnl_mm2s and krnl_s2mm.
#
# NEW: krnl_mm2s_bcast6 (Vitis/krnl_mm2s_bcast.cpp) -- one m_axi, 6 AXIS outputs.
# mm2s_bcast_a0 reads HBM[0] and sends every beat to every engine's s_axis_a0;
# mm2s_bcast_a1 reads HBM[1] -> every s_axis_a1. The tenants have NO activation
# movers, so every engine gets the SAME vector, always: the host must run every
# engine on every calculation, in lockstep (workload/host_workload_bcast.cpp).
#
# Used as:  v++ -l --config sparse_hbm_4x4_x6_bcast.cfg --config impl_family.cfg \
#                  --config slr_floorplan_4x4_x6_bcast[_split].cfg --kernel_frequency 375 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ----------------------------------------------------
# Names are explicit. Positional naming across 18 movers would make one
# transposed digit bind a tenant's index channel to another's weight
# stream -- wrong answers on both, no error.
nk=krnl_mm2s:18:mm2s_w0_t0.mm2s_w1_t0.mm2s_i0_t0.mm2s_w0_t1.mm2s_w1_t1.mm2s_i0_t1.mm2s_w0_t2.mm2s_w1_t2.mm2s_i0_t2.mm2s_w0_t3.mm2s_w1_t3.mm2s_i0_t3.mm2s_w0_t4.mm2s_w1_t4.mm2s_i0_t4.mm2s_w0_t5.mm2s_w1_t5.mm2s_i0_t5
nk=krnl_mm2s_bcast6:2:mm2s_bcast_a0.mm2s_bcast_a1
nk=krnl_gemv_sparse:6:gemv_t0.gemv_t1.gemv_t2.gemv_t3.gemv_t4.gemv_t5
nk=krnl_s2mm:6:s2mm_c0_t0.s2mm_c0_t1.s2mm_c0_t2.s2mm_c0_t3.s2mm_c0_t4.s2mm_c0_t5

# ---- memory binding: THE VECTOR, ONE copy in HBM[0] and HBM[1] ---------
# Read by the broadcast pair only: one master per channel, as everywhere else.
sp=mm2s_bcast_a0.in:HBM[0]
sp=mm2s_bcast_a1.in:HBM[1]

# ---- memory binding: tenant k owns HBM[2+4*k .. 2+4*k+3] -------------

# tenant 0 -> HBM[2..5]
sp=mm2s_w0_t0.in:HBM[2]
sp=mm2s_w1_t0.in:HBM[3]
sp=mm2s_i0_t0.in:HBM[4]
sp=s2mm_c0_t0.out:HBM[5]

# tenant 1 -> HBM[6..9]
sp=mm2s_w0_t1.in:HBM[6]
sp=mm2s_w1_t1.in:HBM[7]
sp=mm2s_i0_t1.in:HBM[8]
sp=s2mm_c0_t1.out:HBM[9]

# tenant 2 -> HBM[10..13]
sp=mm2s_w0_t2.in:HBM[10]
sp=mm2s_w1_t2.in:HBM[11]
sp=mm2s_i0_t2.in:HBM[12]
sp=s2mm_c0_t2.out:HBM[13]

# tenant 3 -> HBM[14..17]   (straddles the two HBM stacks at PC 16)
sp=mm2s_w0_t3.in:HBM[14]
sp=mm2s_w1_t3.in:HBM[15]
sp=mm2s_i0_t3.in:HBM[16]
sp=s2mm_c0_t3.out:HBM[17]

# tenant 4 -> HBM[18..21]
sp=mm2s_w0_t4.in:HBM[18]
sp=mm2s_w1_t4.in:HBM[19]
sp=mm2s_i0_t4.in:HBM[20]
sp=s2mm_c0_t4.out:HBM[21]

# tenant 5 -> HBM[22..25]
sp=mm2s_w0_t5.in:HBM[22]
sp=mm2s_w1_t5.in:HBM[23]
sp=mm2s_i0_t5.in:HBM[24]
sp=s2mm_c0_t5.out:HBM[25]

# ---- kernel-to-kernel streams, WITHIN each tenant ---------------------
# A mistyped port name here is a link WARNING, not an error: the stream is
# left dangling and that tenant's barrier join waits forever for a channel
# that never arrives. If one tenant hangs and the others finish, look here
# first -- its join waits on ALL 3 weight+index PCs.

# tenant 0
stream_connect=mm2s_w0_t0.out:gemv_t0.s_axis_w0
stream_connect=mm2s_w1_t0.out:gemv_t0.s_axis_w1
stream_connect=mm2s_i0_t0.out:gemv_t0.s_axis_ind0
stream_connect=gemv_t0.m_axis_c0:s2mm_c0_t0.in

# tenant 1
stream_connect=mm2s_w0_t1.out:gemv_t1.s_axis_w0
stream_connect=mm2s_w1_t1.out:gemv_t1.s_axis_w1
stream_connect=mm2s_i0_t1.out:gemv_t1.s_axis_ind0
stream_connect=gemv_t1.m_axis_c0:s2mm_c0_t1.in

# tenant 2
stream_connect=mm2s_w0_t2.out:gemv_t2.s_axis_w0
stream_connect=mm2s_w1_t2.out:gemv_t2.s_axis_w1
stream_connect=mm2s_i0_t2.out:gemv_t2.s_axis_ind0
stream_connect=gemv_t2.m_axis_c0:s2mm_c0_t2.in

# tenant 3
stream_connect=mm2s_w0_t3.out:gemv_t3.s_axis_w0
stream_connect=mm2s_w1_t3.out:gemv_t3.s_axis_w1
stream_connect=mm2s_i0_t3.out:gemv_t3.s_axis_ind0
stream_connect=gemv_t3.m_axis_c0:s2mm_c0_t3.in

# tenant 4
stream_connect=mm2s_w0_t4.out:gemv_t4.s_axis_w0
stream_connect=mm2s_w1_t4.out:gemv_t4.s_axis_w1
stream_connect=mm2s_i0_t4.out:gemv_t4.s_axis_ind0
stream_connect=gemv_t4.m_axis_c0:s2mm_c0_t4.in

# tenant 5
stream_connect=mm2s_w0_t5.out:gemv_t5.s_axis_w0
stream_connect=mm2s_w1_t5.out:gemv_t5.s_axis_w1
stream_connect=mm2s_i0_t5.out:gemv_t5.s_axis_ind0
stream_connect=gemv_t5.m_axis_c0:s2mm_c0_t5.in

# ---- the broadcast: output k of each broadcast mover -> engine k --------
# A missing or mistyped line here is a link WARNING, not an error, and it
# hangs EVERYTHING: that engine never gets its vector, and the broadcast mover
# stalls on the dangling output (every output must accept every beat).

# mm2s_bcast_a0 (HBM[0], elements 0-15 of each window) -> every s_axis_a0
stream_connect=mm2s_bcast_a0.out0:gemv_t0.s_axis_a0
stream_connect=mm2s_bcast_a0.out1:gemv_t1.s_axis_a0
stream_connect=mm2s_bcast_a0.out2:gemv_t2.s_axis_a0
stream_connect=mm2s_bcast_a0.out3:gemv_t3.s_axis_a0
stream_connect=mm2s_bcast_a0.out4:gemv_t4.s_axis_a0
stream_connect=mm2s_bcast_a0.out5:gemv_t5.s_axis_a0

# mm2s_bcast_a1 (HBM[1], elements 16-31 of each window) -> every s_axis_a1
stream_connect=mm2s_bcast_a1.out0:gemv_t0.s_axis_a1
stream_connect=mm2s_bcast_a1.out1:gemv_t1.s_axis_a1
stream_connect=mm2s_bcast_a1.out2:gemv_t2.s_axis_a1
stream_connect=mm2s_bcast_a1.out3:gemv_t3.s_axis_a1
stream_connect=mm2s_bcast_a1.out4:gemv_t4.s_axis_a1
stream_connect=mm2s_bcast_a1.out5:gemv_t5.s_axis_a1

# ---- kernel clock -----------------------------------------------------
# NOT SET HERE -- a [clock] section maps to v++ --clock, which this
# platform rejects. Use  v++ -l ... --kernel_frequency 375
# ONE clock for every tenant: tenants share the card, so they share the
# frequency. A tenant cannot be clocked independently of its neighbours.
