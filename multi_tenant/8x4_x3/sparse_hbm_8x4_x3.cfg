# --------------------------------------------------------------------------
# sparse_hbm_8x4_x3.cfg -- 3 INDEPENDENT 8x4 tenants on one U280.
#
# GENERATED by multi_tenant/make_multi_build.py. Tenant k = one complete
# 8x4 engine (8 cores x 4 blocks, 256 DSPs) with its own matrix, its own
# sparsity mode and its own 10 HBM pseudo-channels HBM[10*k .. 10*k+9].
#
# 3 tenants  ->  30 of 32 HBM channels, 30 mover CUs + 3 engines = 33 CUs.
#
# THE ENGINE .xo IS UNCHANGED. This is the same krnl_gemv_sparse_8x4.xo that
# closed at 375 MHz as a single tenant, instantiated 3 times.
#
# NOTHING IS SHARED BETWEEN TENANTS except the card, HBM and the kernel
# clock. No stream crosses from one tenant to another; a cross-wired
# stream_connect would show up immediately because every tenant runs a
# DIFFERENT matrix and is compared against its own golden.
#
# Used as:  v++ -l --config sparse_hbm_8x4_x3.cfg --config impl_family.cfg \
#                  --config slr_floorplan_8x4_x3.cfg --kernel_frequency 375 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ----------------------------------------------------
# Names are explicit. Positional naming across 24 movers would make one
# transposed digit bind a tenant's index channel to another's weight
# stream -- wrong answers on both, no error.
nk=krnl_mm2s:24:mm2s_w0_t0.mm2s_w1_t0.mm2s_w2_t0.mm2s_w3_t0.mm2s_i0_t0.mm2s_i1_t0.mm2s_a0_t0.mm2s_a1_t0.mm2s_w0_t1.mm2s_w1_t1.mm2s_w2_t1.mm2s_w3_t1.mm2s_i0_t1.mm2s_i1_t1.mm2s_a0_t1.mm2s_a1_t1.mm2s_w0_t2.mm2s_w1_t2.mm2s_w2_t2.mm2s_w3_t2.mm2s_i0_t2.mm2s_i1_t2.mm2s_a0_t2.mm2s_a1_t2
nk=krnl_gemv_sparse:3:gemv_t0.gemv_t1.gemv_t2
nk=krnl_s2mm:6:s2mm_c0_t0.s2mm_c1_t0.s2mm_c0_t1.s2mm_c1_t1.s2mm_c0_t2.s2mm_c1_t2

# ---- memory binding: tenant k owns HBM[10*k .. 10*k+9] ----------------

# tenant 0 -> HBM[0..9]
sp=mm2s_w0_t0.in:HBM[0]
sp=mm2s_w1_t0.in:HBM[1]
sp=mm2s_w2_t0.in:HBM[2]
sp=mm2s_w3_t0.in:HBM[3]
sp=mm2s_i0_t0.in:HBM[4]
sp=mm2s_i1_t0.in:HBM[5]
sp=mm2s_a0_t0.in:HBM[6]
sp=mm2s_a1_t0.in:HBM[7]
sp=s2mm_c0_t0.out:HBM[8]
sp=s2mm_c1_t0.out:HBM[9]

# tenant 1 -> HBM[10..19]   (straddles the two HBM stacks at PC 16)
sp=mm2s_w0_t1.in:HBM[10]
sp=mm2s_w1_t1.in:HBM[11]
sp=mm2s_w2_t1.in:HBM[12]
sp=mm2s_w3_t1.in:HBM[13]
sp=mm2s_i0_t1.in:HBM[14]
sp=mm2s_i1_t1.in:HBM[15]
sp=mm2s_a0_t1.in:HBM[16]
sp=mm2s_a1_t1.in:HBM[17]
sp=s2mm_c0_t1.out:HBM[18]
sp=s2mm_c1_t1.out:HBM[19]

# tenant 2 -> HBM[20..29]
sp=mm2s_w0_t2.in:HBM[20]
sp=mm2s_w1_t2.in:HBM[21]
sp=mm2s_w2_t2.in:HBM[22]
sp=mm2s_w3_t2.in:HBM[23]
sp=mm2s_i0_t2.in:HBM[24]
sp=mm2s_i1_t2.in:HBM[25]
sp=mm2s_a0_t2.in:HBM[26]
sp=mm2s_a1_t2.in:HBM[27]
sp=s2mm_c0_t2.out:HBM[28]
sp=s2mm_c1_t2.out:HBM[29]

# ---- kernel-to-kernel streams, WITHIN each tenant ---------------------
# A mistyped port name here is a link WARNING, not an error: the stream is
# left dangling and that tenant's barrier join waits forever for a channel
# that never arrives. If one tenant hangs and the others finish, look here
# first -- its join waits on ALL 6 weight+index PCs.

# tenant 0
stream_connect=mm2s_w0_t0.out:gemv_t0.s_axis_w0
stream_connect=mm2s_w1_t0.out:gemv_t0.s_axis_w1
stream_connect=mm2s_w2_t0.out:gemv_t0.s_axis_w2
stream_connect=mm2s_w3_t0.out:gemv_t0.s_axis_w3
stream_connect=mm2s_i0_t0.out:gemv_t0.s_axis_ind0
stream_connect=mm2s_i1_t0.out:gemv_t0.s_axis_ind1
stream_connect=mm2s_a0_t0.out:gemv_t0.s_axis_a0
stream_connect=mm2s_a1_t0.out:gemv_t0.s_axis_a1
stream_connect=gemv_t0.m_axis_c0:s2mm_c0_t0.in
stream_connect=gemv_t0.m_axis_c1:s2mm_c1_t0.in

# tenant 1
stream_connect=mm2s_w0_t1.out:gemv_t1.s_axis_w0
stream_connect=mm2s_w1_t1.out:gemv_t1.s_axis_w1
stream_connect=mm2s_w2_t1.out:gemv_t1.s_axis_w2
stream_connect=mm2s_w3_t1.out:gemv_t1.s_axis_w3
stream_connect=mm2s_i0_t1.out:gemv_t1.s_axis_ind0
stream_connect=mm2s_i1_t1.out:gemv_t1.s_axis_ind1
stream_connect=mm2s_a0_t1.out:gemv_t1.s_axis_a0
stream_connect=mm2s_a1_t1.out:gemv_t1.s_axis_a1
stream_connect=gemv_t1.m_axis_c0:s2mm_c0_t1.in
stream_connect=gemv_t1.m_axis_c1:s2mm_c1_t1.in

# tenant 2
stream_connect=mm2s_w0_t2.out:gemv_t2.s_axis_w0
stream_connect=mm2s_w1_t2.out:gemv_t2.s_axis_w1
stream_connect=mm2s_w2_t2.out:gemv_t2.s_axis_w2
stream_connect=mm2s_w3_t2.out:gemv_t2.s_axis_w3
stream_connect=mm2s_i0_t2.out:gemv_t2.s_axis_ind0
stream_connect=mm2s_i1_t2.out:gemv_t2.s_axis_ind1
stream_connect=mm2s_a0_t2.out:gemv_t2.s_axis_a0
stream_connect=mm2s_a1_t2.out:gemv_t2.s_axis_a1
stream_connect=gemv_t2.m_axis_c0:s2mm_c0_t2.in
stream_connect=gemv_t2.m_axis_c1:s2mm_c1_t2.in

# ---- kernel clock -----------------------------------------------------
# NOT SET HERE -- a [clock] section maps to v++ --clock, which this
# platform rejects. Use  v++ -l ... --kernel_frequency 375
# ONE clock for every tenant: tenants share the card, so they share the
# frequency. A tenant cannot be clocked independently of its neighbours.
