# --------------------------------------------------------------------------
# slr_floorplan_8x4_x3_bcast.cfg -- every compute unit in SLR0.
#
# NOT USED BY THIS BUILD -- it uses slr_floorplan_8x4_x3_bcast_split.cfg.
# Kept for reference; the reasons are in that file.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   26 movers     364 BRAM  (8 per tenant + the broadcast pair, 14 each)
#   3 x engine    135 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 529 of SLR0's 672 tiles = 79%
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

