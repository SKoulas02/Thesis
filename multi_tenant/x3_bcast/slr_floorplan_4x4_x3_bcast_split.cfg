# --------------------------------------------------------------------------
# slr_floorplan_4x4_x3_bcast_split.cfg -- the engines get SLR1.
#
# NOT THE DEFAULT at this size. Use slr_floorplan_4x4_x3_bcast.cfg (everything
# in SLR0) first and switch only if the build misses its frequency.
#
# The 3 engines are 53,931 LUT and 93 BRAM together -- they fit one die
# easily. The movers stay in SLR0 beside the HBM they master, the broadcast
# pair with them; its 3 outputs cross to SLR1 like every mover's stream.
#
# SLR0 then holds the 14 movers and the platform: ~226 of 672 BRAM (34%).
# --------------------------------------------------------------------------

[connectivity]

# the broadcast pair: beside the HBM it reads
slr=mm2s_bcast_a0:SLR0
slr=mm2s_bcast_a1:SLR0

# tenant 0
slr=gemv_t0:SLR1
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=s2mm_c0_t0:SLR0

# tenant 1
slr=gemv_t1:SLR1
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=s2mm_c0_t1:SLR0

# tenant 2
slr=gemv_t2:SLR1
slr=mm2s_w0_t2:SLR0
slr=mm2s_w1_t2:SLR0
slr=mm2s_i0_t2:SLR0
slr=s2mm_c0_t2:SLR0
