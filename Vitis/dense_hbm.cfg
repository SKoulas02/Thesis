# ----------------------------------------------------------------------------
# dense_hbm.cfg -- link configuration for the DENSE GEMV system on HBM.
#
#   10 x krnl_mm2s  ->  krnl_gemv_dense (free-running)  ->  4 x krnl_s2mm
#
# 14 HBM pseudo-channels: 8 weights + 2 activations in, 4 results out.
#
# THIS FILE IS THE ENTIRE HBM-vs-DDR EXPERIMENT (INTEGRATION_PLAN.md 7.2).
# Swapping HBM[n] for DDR[0] changes the memory system without touching one
# line of RTL or one line of host code.
#
# Used as:  v++ -l --config dense_hbm.cfg ...
# ----------------------------------------------------------------------------

[connectivity]

# ---- compute units ---------------------------------------------------------
# Names are given explicitly. Without them every sp= and stream_connect= below
# would address krnl_mm2s_1 .. krnl_mm2s_10 by position, and one transposed
# digit would silently bind a weight channel to an activation stream -- wrong
# answers, no error.
nk=krnl_mm2s:10:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_w6.mm2s_w7.mm2s_a0.mm2s_a1
nk=krnl_gemv_dense:1:gemv
nk=krnl_s2mm:4:s2mm_c0.s2mm_c1.s2mm_c2.s2mm_c3

# ---- memory binding: one m_axi argument per pseudo-channel ------------------
# 'in' / 'out' are the kernel ARGUMENT names, not the bundle names.
sp=mm2s_w0.in:HBM[0]
sp=mm2s_w1.in:HBM[1]
sp=mm2s_w2.in:HBM[2]
sp=mm2s_w3.in:HBM[3]
sp=mm2s_w4.in:HBM[4]
sp=mm2s_w5.in:HBM[5]
sp=mm2s_w6.in:HBM[6]
sp=mm2s_w7.in:HBM[7]
sp=mm2s_a0.in:HBM[8]
sp=mm2s_a1.in:HBM[9]

sp=s2mm_c0.out:HBM[10]
sp=s2mm_c1.out:HBM[11]
sp=s2mm_c2.out:HBM[12]
sp=s2mm_c3.out:HBM[13]

# ---- kernel-to-kernel streams ----------------------------------------------
# Format: <producer_cu>.<out_port>:<consumer_cu>.<in_port>[:<fifo_depth>]
# The optional fifo_depth is the first thing to try if a stream stalls in
# hw_emu, and a knob for the 7.3 bandwidth work.
#
# WARNING: a mistyped port name here is a link WARNING, not an error. The
# stream is simply left dangling and the engine's barrier join waits forever
# for a channel that never arrives. If hw_emu hangs, check these first.
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5
stream_connect=mm2s_w6.out:gemv.s_axis_w6
stream_connect=mm2s_w7.out:gemv.s_axis_w7
stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in
stream_connect=gemv.m_axis_c3:s2mm_c3.in

# ---- kernel clock ----------------------------------------------------------
# NOT SET HERE. A [clock] section maps to v++ --clock, which this platform
# rejects:
#   ERROR: [v++ 60-2308] --clock options can only be used if a platform
#                        contains fixed reference clocks
# xilinx_u280_xdma_201920_3 is a 2019.2-era platform without them. Use the
# older command-line flag instead, and only where it matters:
#
#   hw_emu : omit it entirely -- this is simulation, the clock is irrelevant
#   hw     : v++ -l ... --kernel_frequency 300
#
# The movers estimate 411 MHz, so the compute engine sets the ceiling; push the
# frequency at S22 once dense runs correctly on hardware.
