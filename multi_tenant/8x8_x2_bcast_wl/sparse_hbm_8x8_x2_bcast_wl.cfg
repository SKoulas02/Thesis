# --------------------------------------------------------------------------
# sparse_hbm_8x8_x2_bcast_wl.cfg -- 2 8x8 tenants on one U280, fed ONE activation
# vector by ONE BROADCAST MOVER PAIR.
#
# GENERATED by multi_tenant/make_bcast_build.py. Tenant k = one complete
# 8x8 engine (8 cores x 8 blocks, 512 DSPs) with its own matrix, its own
# sparsity mode and its own 15 HBM pseudo-channels -- LAYOUT writes-last: the
# weights + indices of every engine from HBM[2] up, ALL outputs on the highest
# channels (the layout of the single 4x32, the other 32-port build that reads
# back correctly). The vector: ONE copy in HBM[0] and HBM[1].
#
# 2 tenants  ->  32 of 32 HBM channels, 32 mover CUs (= 32 of the 32 HBM kernel
# ports) + 2 engines = 34 CUs. (A mover pair per tenant would need 34 ports.)
#
# THE ENGINE .xo IS UNCHANGED: krnl_gemv_sparse_8x8.xo, 325 MHz as a single
# tenant, instantiated 2 times; so are krnl_mm2s and krnl_s2mm.
#
# NEW: krnl_mm2s_bcast2 (Vitis/krnl_mm2s_bcast.cpp) -- one m_axi, 2 AXIS outputs.
# mm2s_bcast_a0 reads HBM[0] and sends every beat to every engine's s_axis_a0;
# mm2s_bcast_a1 reads HBM[1] -> every s_axis_a1. The tenants have NO activation
# movers, so every engine gets the SAME vector, always: the host must run every
# engine on every calculation, in lockstep (workload/host_workload_bcast.cpp).
#
# Used as:  v++ -l --config sparse_hbm_8x8_x2_bcast_wl.cfg --config impl_family.cfg \
#                  --config slr_floorplan_8x8_x2_bcast_wl[_split].cfg --kernel_frequency 325 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ----------------------------------------------------
# Names are explicit. Positional naming across 22 movers would make one
# transposed digit bind a tenant's index channel to another's weight
# stream -- wrong answers on both, no error.
nk=krnl_mm2s:22:mm2s_w0_t0.mm2s_w1_t0.mm2s_w2_t0.mm2s_w3_t0.mm2s_w4_t0.mm2s_w5_t0.mm2s_w6_t0.mm2s_w7_t0.mm2s_i0_t0.mm2s_i1_t0.mm2s_i2_t0.mm2s_w0_t1.mm2s_w1_t1.mm2s_w2_t1.mm2s_w3_t1.mm2s_w4_t1.mm2s_w5_t1.mm2s_w6_t1.mm2s_w7_t1.mm2s_i0_t1.mm2s_i1_t1.mm2s_i2_t1
nk=krnl_mm2s_bcast2:2:mm2s_bcast_a0.mm2s_bcast_a1
nk=krnl_gemv_sparse:2:gemv_t0.gemv_t1
nk=krnl_s2mm:8:s2mm_c0_t0.s2mm_c1_t0.s2mm_c2_t0.s2mm_c3_t0.s2mm_c0_t1.s2mm_c1_t1.s2mm_c2_t1.s2mm_c3_t1

# ---- memory binding: THE VECTOR, ONE copy in HBM[0] and HBM[1] ---------
# Read by the broadcast pair only: one master per channel, as everywhere else.
sp=mm2s_bcast_a0.in:HBM[0]
sp=mm2s_bcast_a1.in:HBM[1]

# ---- memory binding, writes-last: inputs from HBM[2] up, outputs last ----

# tenant 0: weights + indices
sp=mm2s_w0_t0.in:HBM[2]
sp=mm2s_w1_t0.in:HBM[3]
sp=mm2s_w2_t0.in:HBM[4]
sp=mm2s_w3_t0.in:HBM[5]
sp=mm2s_w4_t0.in:HBM[6]
sp=mm2s_w5_t0.in:HBM[7]
sp=mm2s_w6_t0.in:HBM[8]
sp=mm2s_w7_t0.in:HBM[9]
sp=mm2s_i0_t0.in:HBM[10]
sp=mm2s_i1_t0.in:HBM[11]
sp=mm2s_i2_t0.in:HBM[12]

# tenant 1: weights + indices
sp=mm2s_w0_t1.in:HBM[13]
sp=mm2s_w1_t1.in:HBM[14]
sp=mm2s_w2_t1.in:HBM[15]
sp=mm2s_w3_t1.in:HBM[16]
sp=mm2s_w4_t1.in:HBM[17]
sp=mm2s_w5_t1.in:HBM[18]
sp=mm2s_w6_t1.in:HBM[19]
sp=mm2s_w7_t1.in:HBM[20]
sp=mm2s_i0_t1.in:HBM[21]
sp=mm2s_i1_t1.in:HBM[22]
sp=mm2s_i2_t1.in:HBM[23]

# tenant 0: outputs
sp=s2mm_c0_t0.out:HBM[24]
sp=s2mm_c1_t0.out:HBM[25]
sp=s2mm_c2_t0.out:HBM[26]
sp=s2mm_c3_t0.out:HBM[27]

# tenant 1: outputs
sp=s2mm_c0_t1.out:HBM[28]
sp=s2mm_c1_t1.out:HBM[29]
sp=s2mm_c2_t1.out:HBM[30]
sp=s2mm_c3_t1.out:HBM[31]


# ---- kernel-to-kernel streams, WITHIN each tenant ---------------------
# A mistyped port name here is a link WARNING, not an error: the stream is
# left dangling and that tenant's barrier join waits forever for a channel
# that never arrives. If one tenant hangs and the others finish, look here
# first -- its join waits on ALL 11 weight+index PCs.

# tenant 0
stream_connect=mm2s_w0_t0.out:gemv_t0.s_axis_w0
stream_connect=mm2s_w1_t0.out:gemv_t0.s_axis_w1
stream_connect=mm2s_w2_t0.out:gemv_t0.s_axis_w2
stream_connect=mm2s_w3_t0.out:gemv_t0.s_axis_w3
stream_connect=mm2s_w4_t0.out:gemv_t0.s_axis_w4
stream_connect=mm2s_w5_t0.out:gemv_t0.s_axis_w5
stream_connect=mm2s_w6_t0.out:gemv_t0.s_axis_w6
stream_connect=mm2s_w7_t0.out:gemv_t0.s_axis_w7
stream_connect=mm2s_i0_t0.out:gemv_t0.s_axis_ind0
stream_connect=mm2s_i1_t0.out:gemv_t0.s_axis_ind1
stream_connect=mm2s_i2_t0.out:gemv_t0.s_axis_ind2
stream_connect=gemv_t0.m_axis_c0:s2mm_c0_t0.in
stream_connect=gemv_t0.m_axis_c1:s2mm_c1_t0.in
stream_connect=gemv_t0.m_axis_c2:s2mm_c2_t0.in
stream_connect=gemv_t0.m_axis_c3:s2mm_c3_t0.in

# tenant 1
stream_connect=mm2s_w0_t1.out:gemv_t1.s_axis_w0
stream_connect=mm2s_w1_t1.out:gemv_t1.s_axis_w1
stream_connect=mm2s_w2_t1.out:gemv_t1.s_axis_w2
stream_connect=mm2s_w3_t1.out:gemv_t1.s_axis_w3
stream_connect=mm2s_w4_t1.out:gemv_t1.s_axis_w4
stream_connect=mm2s_w5_t1.out:gemv_t1.s_axis_w5
stream_connect=mm2s_w6_t1.out:gemv_t1.s_axis_w6
stream_connect=mm2s_w7_t1.out:gemv_t1.s_axis_w7
stream_connect=mm2s_i0_t1.out:gemv_t1.s_axis_ind0
stream_connect=mm2s_i1_t1.out:gemv_t1.s_axis_ind1
stream_connect=mm2s_i2_t1.out:gemv_t1.s_axis_ind2
stream_connect=gemv_t1.m_axis_c0:s2mm_c0_t1.in
stream_connect=gemv_t1.m_axis_c1:s2mm_c1_t1.in
stream_connect=gemv_t1.m_axis_c2:s2mm_c2_t1.in
stream_connect=gemv_t1.m_axis_c3:s2mm_c3_t1.in

# ---- the broadcast: output k of each broadcast mover -> engine k --------
# A missing or mistyped line here is a link WARNING, not an error, and it
# hangs EVERYTHING: that engine never gets its vector, and the broadcast mover
# stalls on the dangling output (every output must accept every beat).

# mm2s_bcast_a0 (HBM[0], elements 0-15 of each window) -> every s_axis_a0
stream_connect=mm2s_bcast_a0.out0:gemv_t0.s_axis_a0
stream_connect=mm2s_bcast_a0.out1:gemv_t1.s_axis_a0

# mm2s_bcast_a1 (HBM[1], elements 16-31 of each window) -> every s_axis_a1
stream_connect=mm2s_bcast_a1.out0:gemv_t0.s_axis_a1
stream_connect=mm2s_bcast_a1.out1:gemv_t1.s_axis_a1

# ---- kernel clock -----------------------------------------------------
# NOT SET HERE -- a [clock] section maps to v++ --clock, which this
# platform rejects. Use  v++ -l ... --kernel_frequency 325
# ONE clock for every tenant: tenants share the card, so they share the
# frequency. A tenant cannot be clocked independently of its neighbours.
