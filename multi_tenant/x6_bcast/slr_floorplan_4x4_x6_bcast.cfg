# --------------------------------------------------------------------------
# slr_floorplan_4x4_x6_bcast.cfg -- every compute unit in SLR0.
#
# NOT USED BY THIS BUILD -- it uses slr_floorplan_4x4_x6_bcast_split.cfg.
# Kept for reference; the reasons are in that file.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   26 movers     364 BRAM  (4 per tenant + the broadcast pair, 14 each)
#   6 x engine    186 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 580 of SLR0's 672 tiles = 86%
#   ^^ ABOVE 85%: expect placement pressure. Use the _split variant.
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

