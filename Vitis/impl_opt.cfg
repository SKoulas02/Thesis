# ----------------------------------------------------------------------------
# impl_opt.cfg -- Vivado implementation strategy for the congested sparse build.
#
# SEPARATE FROM sparse_hbm.cfg ON PURPOSE. That file describes WHAT is connected
# to what (CUs, HBM channels, streams) and is the same for every build. This one
# describes HOW HARD the tools try, and is the variable under test. Keeping them
# apart means a build differs from the baseline in exactly one file, which is
# what makes "the strategy bought N ps" a statement you can defend.
#
# Used as:  v++ -l --config sparse_hbm.cfg --config impl_opt.cfg ...
#           (v++ accepts multiple --config; later files add to earlier ones)
#
# ---- WHY THESE FOUR ---------------------------------------------------------
# Measured problem on the 250 MHz build:
#   * P1  the activation broadcast -- one net, fo=128, 3.246 ns, 93% of the
#         critical path's route delay. Addressed in RTL by the fanout
#         attributes on c_core_4.0.vhd's A_internal.
#   * P2  regional congestion -- s2mm_c2 (an HLS mover that was NEVER critical
#         in the dense build) failing at -0.177 ns with 82% route on 6 logic
#         levels. Not slow logic; a full region.
#
# phys_opt_design attacks BOTH, and it is the only lever here that can replicate
# a high-fanout driver on its own initiative. POST_ROUTE runs it again with real
# routing delays in hand instead of estimates, which is exactly the situation
# where a 93%-route path can still be rescued.
#
# Cost is build time only (expect +1-2 h). Nothing here can change behaviour --
# these are placement and routing decisions, not logic transformations.
#
# NOT included, deliberately, and held in reserve:
#   PLACE_DESIGN.ARGS.DIRECTIVE=ExtraTimingOpt
#   ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
# Those can roughly double the build. If the attributes plus phys-opt do not
# close the target, they are the next thing to try -- spending every lever at
# once leaves nothing to escalate to, and makes it impossible to attribute the
# gain.
# ----------------------------------------------------------------------------

[vivado]

prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
