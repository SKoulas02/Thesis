# --------------------------------------------------------------------------
# slr_floorplan_8x4_x3_split.cfg -- the engines get SLR1.
#
# USE THIS ONE AT THIS SIZE. Everything in SLR0 would need ~585 of 672
# BRAM (87%), and that die stops working above ~85%: 5 x 4x4 at 92% fell
# to 260 MHz AND hung one tenant on the card, while the same design split
# (SLR0 at 69%) closed 329 MHz with all five tenants bit-exact.
#
# The 3 engines are 106,314 LUT and 135 BRAM together -- they fit one die
# easily. The movers stay in SLR0 beside the HBM they master.
# --------------------------------------------------------------------------

[connectivity]

# tenant 0
slr=gemv_t0:SLR1
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_w2_t0:SLR0
slr=mm2s_w3_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=mm2s_i1_t0:SLR0
slr=mm2s_a0_t0:SLR0
slr=mm2s_a1_t0:SLR0
slr=s2mm_c0_t0:SLR0
slr=s2mm_c1_t0:SLR0

# tenant 1
slr=gemv_t1:SLR1
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_w2_t1:SLR0
slr=mm2s_w3_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=mm2s_i1_t1:SLR0
slr=mm2s_a0_t1:SLR0
slr=mm2s_a1_t1:SLR0
slr=s2mm_c0_t1:SLR0
slr=s2mm_c1_t1:SLR0

