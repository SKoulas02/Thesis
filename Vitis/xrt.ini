; ---------------------------------------------------------------------------
; xrt.ini -- runtime profiling for the GEMV kernels.
;
; XRT reads this from the CURRENT WORKING DIRECTORY of the host process, so it
; must sit next to wherever you launch ./host from, not next to the .xclbin.
;
; Data collected here is only as good as the monitors built into the xclbin:
;   opencl_summary / opencl_trace  -> host-side, work with ANY xclbin
;   device_trace / device_counters -> need hardware monitors, i.e. the xclbin
;                                     must have been linked with
;                                     --profile.data and --profile.exec
;
; USE THE PROFILING BUILD for device numbers. The clean build has no monitors,
; so device_trace silently produces nothing -- an empty trace looks exactly like
; "the kernel was too fast", which is the classic way to waste an afternoon.
;
; OUTPUT (written to the run directory):
;   profile_summary.csv   counters: per-CU execution, per-port bytes/transfers
;   timeline_trace.csv    time-ordered events
;   *.run_summary         open with:  vitis_analyzer <file>.run_summary
;
; KEY NAMES SHIFTED BETWEEN XRT RELEASES. This machine runs XRT 2.13 (branch
; 2022.1) against Vitis 2021.1, which straddles the rename (the old set was
; profile= / timeline_trace= / data_transfer_trace=). If a run produces no CSVs,
; check the key names for THIS XRT before assuming the design is at fault:
;   grep -ri "opencl_summary\|device_trace" /opt/xilinx/xrt/share /opt/xilinx/xrt/doc 2>/dev/null
; ---------------------------------------------------------------------------

[Debug]
; ---- host side: works with any xclbin, no hardware cost ----
opencl_summary=true
opencl_trace=true

; ---- device side: REQUIRES the --profile.data / --profile.exec build ----
device_counters=true
device_trace=coarse
; 'fine' captures every transaction and fills the trace buffer quickly; start
; coarse, and only go fine on a small case if you need per-transaction detail.

; Trace buffer. The default is small; a long run overflows it and silently
; truncates. Raise if the summary reports dropped trace packets.
trace_buffer_size=64M

[Runtime]
runtime_log=console
verbosity=1
