# ----------------------------------------------------------------------------
# sparse_ddr.cfg -- the SPARSE GEMV system on DDR4 instead of HBM (§7.2).
#
# IDENTICAL to sparse_hbm.cfg except for the sp= lines. No RTL changes, no HLS
# changes, no host changes: host_sparse.cpp creates plain cl::Buffer with
# CL_MEM_USE_HOST_PTR and NO cl_mem_ext_ptr_t, so XRT takes bank placement from
# the xclbin. That is the whole point of the experiment -- the memory system is
# the only variable.
#
# WHY 17 STREAMS ONTO 2 BANKS. The U280 has 32 HBM pseudo-channels but only TWO
# DDR4 banks. Every stream that had its own PC now shares one of two controllers.
# The split below balances stream COUNT across the banks (9 and 8) rather than
# segregating reads from writes, because aggregate bandwidth matters more here
# than avoiding read/write turnaround: writes are at most ~27% of traffic (at
# 2:32, where output is 4x32 B/cycle against 11x32 B/cycle in) and less in every
# denser mode. Putting all reads on one bank would cap them at one controller.
#
# WHAT THIS MEASURES, AND THE PREDICTION. At 300 MHz the sparse engine wants
# 11 x 32 B x 300 MHz = 105.6 GB/s of input. Two DDR4-2400 banks supply roughly
# 38.4 GB/s combined -- about 36% of demand. So the design SHOULD become
# memory-bound, and the speed-up over dense should stop being the BEAT ratio and
# become the BYTE ratio:
#
#     per row      dense 2048 B | 2:4 1408 | 2:8 704 | 2:16 352 | 2:32 176
#     HBM  (beats) 1.00x        | 2.00x    | 4.00x   | 8.00x    | 16.00x
#     DDR  (bytes) 1.00x        | 1.45x    | 2.91x   | 5.82x    | 11.64x
#
# If that is what comes out, it is a genuinely useful result: it shows the index
# traffic (27.3% of sparse input bytes, free on HBM because the engine is
# beat-limited not byte-limited) turns into a REAL COST the moment bandwidth
# binds. Record the prediction before the run.
#
# TIMING RISK. 17 masters onto 2 DDR controllers is a very different interconnect
# from 17 onto 17 HBM PCs. It may not close 300 MHz. If it does not, drop the
# clock and RECORD BOTH -- but note the comparison against HBM is then confounded
# by clock, so say so explicitly rather than quoting the throughput as if only
# the memory changed.
#
# Used as:  v++ -l --config sparse_ddr.cfg --config impl_opt.cfg \
#                 --config slr_floorplan.cfg --kernel_frequency 300 ...
#
#   KEEP slr_floorplan.cfg AND impl_opt.cfg. They were both in the measured HBM
#   build, and the experiment is only clean if the memory system is the sole
#   variable.
#
#   AND THE FLOORPLAN SHOULD ACTUALLY SUIT DDR BETTER, verified from
#   platforminfo 2026-09-05:
#
#       HBM     all 32 PCs   -> SLR0        (max 32 masters)
#       DDR[0]               -> SLR0        (max 15 masters)
#       DDR[1]               -> SLR1        (max 15 masters)
#
#   The floorplan pins the engine to SLR1. On HBM that put the engine one die
#   away from ALL of its memory -- 6,853 SLLs crossing SLR1<->SLR0 for the 17
#   AXIS streams. On DDR the memory is SPLIT across the two dice, so roughly half
#   the movers land in SLR1 beside the engine and only the DDR[0] half crosses.
#   Expect FEWER SLL crossings than the HBM build, not more.
#
#   MASTER LIMIT CHECKED: 15 per segment. This split uses 9 on DDR[0] and 8 on
#   DDR[1] -- both inside the limit, with headroom.
# ----------------------------------------------------------------------------

[connectivity]

# ---- compute units (unchanged from sparse_hbm.cfg) -------------------------
nk=krnl_mm2s:13:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_w6.mm2s_w7.mm2s_i0.mm2s_i1.mm2s_i2.mm2s_a0.mm2s_a1
nk=krnl_gemv_sparse:1:gemv
nk=krnl_s2mm:4:s2mm_c0.s2mm_c1.s2mm_c2.s2mm_c3

# ---- memory mapping: THE ONLY THING THAT DIFFERS FROM THE HBM BUILD --------
# DDR[0]: 4 weights + 2 indices + 1 activation + 2 outputs = 9 streams
sp=mm2s_w0.in:DDR[0]
sp=mm2s_w1.in:DDR[0]
sp=mm2s_w2.in:DDR[0]
sp=mm2s_w3.in:DDR[0]
sp=mm2s_i0.in:DDR[0]
sp=mm2s_i1.in:DDR[0]
sp=mm2s_a0.in:DDR[0]
sp=s2mm_c0.out:DDR[0]
sp=s2mm_c1.out:DDR[0]

# DDR[1]: 4 weights + 1 index + 1 activation + 2 outputs = 8 streams
sp=mm2s_w4.in:DDR[1]
sp=mm2s_w5.in:DDR[1]
sp=mm2s_w6.in:DDR[1]
sp=mm2s_w7.in:DDR[1]
sp=mm2s_i2.in:DDR[1]
sp=mm2s_a1.in:DDR[1]
sp=s2mm_c2.out:DDR[1]
sp=s2mm_c3.out:DDR[1]

# ---- kernel-to-kernel streams (byte-identical to sparse_hbm.cfg) -----------
# A mistyped port name here is a link WARNING, not an error: the stream is left
# dangling and the barrier join waits forever for a channel that never arrives.
# The sparse join waits on ALL 11 weight+index PCs, so one dangling index stream
# hangs the engine with no other symptom.
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5
stream_connect=mm2s_w6.out:gemv.s_axis_w6
stream_connect=mm2s_w7.out:gemv.s_axis_w7

stream_connect=mm2s_i0.out:gemv.s_axis_ind0
stream_connect=mm2s_i1.out:gemv.s_axis_ind1
stream_connect=mm2s_i2.out:gemv.s_axis_ind2

stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in
stream_connect=gemv.m_axis_c3:s2mm_c3.in
