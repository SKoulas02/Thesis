# ----------------------------------------------------------------------------
# impl_opt_perf.cfg -- maximum-effort SYNTHESIS and IMPLEMENTATION, for the
#                      325 MHz attempt.
#
# SUPERSEDES impl_opt.cfg for this experiment. Do NOT pass both: they set the
# same phys-opt properties and the later --config wins silently. impl_opt.cfg is
# left untouched because it is what produced the 300 MHz result in the thesis.
#
# Used as:
#   v++ -l --config <design>_hbm.cfg --config impl_opt_perf.cfg \
#          --config slr_floorplan[_dense].cfg --kernel_frequency 325 ...
#
# ---- WHAT IS NEW: SYNTHESIS ------------------------------------------------
# Everything tried so far tuned IMPLEMENTATION only -- where logic goes. Nothing
# had been set for SYNTHESIS, which decides what logic exists. Independent
# levers; this config finally uses both.
#
# Flow_PerfOptimized_high, relevant pieces:
#   -keep_equivalent_registers  Globally what c_core_4.0.vhd's
#                               `equivalent_register_removal = "no"` attribute
#                               does locally on A_internal. That merge was found
#                               by reading a timing report (fanout 128, 3.246 ns
#                               on one net); this disables it everywhere by
#                               policy, so it may catch merges never looked for.
#   -fsm_extraction one_hot     Directly relevant: the critical path after the
#                               fanout fix was mm2s_w2/ap_CS_fsm_reg[71] -- an
#                               HLS mover's FSM state register.
#   -resource_sharing off       Trades area for speed.
#   -no_lc                      No LUT combining. Trades area for speed.
#
# ---- THE ALTERNATIVE WORTH KNOWING ABOUT -----------------------------------
# Flow_AlternateRoutability targets ROUTING CONGESTION rather than logic depth.
# On the evidence that may suit this design better: the worst path is ONE LUT6
# with fanout 7 spending 97% of its 3.955 ns on wire. That is a routability
# problem, and Flow_PerfOptimized_high mostly attacks logic depth. If this build
# gains little, swap the synth line for:
#     prop=run.synth_1.strategy=Flow_AlternateRoutability
# and change nothing else -- one variable at a time.
#
# ---- IMPLEMENTATION --------------------------------------------------------
# Performance_ExplorePostRoutePhysOpt is the stock strategy closest to what was
# hand-assembled in impl_opt.cfg (Explore place/route + post-route phys-opt),
# expressed idiomatically. ONE targeted override on top: route at
# AggressiveExplore rather than Explore, because routing is the measured
# bottleneck and that is where extra effort should go.
#
# HELD IN RESERVE, do not stack them now -- one variable at a time:
#   Performance_Retiming              moves registers across logic; could help
#                                     the mover FSMs specifically
#   Congestion_SSI_SpreadLogic_high   SSI + congestion; built for 3-die parts
#   Performance_BalanceSLLs           balances super-long-line usage
#   Performance_SpreadSLLs            spreads it
# The SSI family overlaps with the explicit slr= floorplan, which already does by
# hand what those do by heuristic. They are the fallback if floorplan + this
# config is not enough.
#
# ---- TWO WARNINGS ----------------------------------------------------------
# ⚠️ AREA. Flow_PerfOptimized_high inflates LUT count ON PURPOSE
# (-resource_sharing off, -no_lc). Fine for a frequency result, but the §7.1
# AREA comparison (LUT -29%, F7 muxes -8192) is only valid if BOTH designs are
# built the same way. If this strategy is adopted, the still-outstanding dense
# OOC area refresh MUST use it too.
#
# ⚠️ RUN NAME UNVERIFIED. Vitis documents `run.synth_1.*`, but this build has a
# reconfigurable-module run (`my_rm_synth_1`) plus 17 block-level CU synthesis
# jobs. Whether `synth_1` reaches them here is NOT confirmed. Watch the first
# minutes for a property warning, and afterwards:
#     grep -i "PerfOptimized\|strategy" _x/logs/link/vivado.log | head
# If it did not apply, the timing result is still valid -- it just is not testing
# what it claims to test, and that must not be written up as if it were.
#
# ⚠️ BUILD TIME. 300 MHz took 3h26m with phys-opt alone. Expect 8-12 hours with
# aggressive place and route on top. tmux, and check `df -h /home` first.
# ----------------------------------------------------------------------------

[vivado]

# ---- synthesis -------------------------------------------------------------
prop=run.synth_1.strategy=Flow_PerfOptimized_high

# ---- implementation --------------------------------------------------------
prop=run.impl_1.strategy=Performance_ExplorePostRoutePhysOpt

# one targeted override: routing is the measured bottleneck, so spend there
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
