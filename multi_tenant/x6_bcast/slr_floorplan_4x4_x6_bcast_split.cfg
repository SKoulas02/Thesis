# --------------------------------------------------------------------------
# slr_floorplan_4x4_x6_bcast_split.cfg -- the engines get SLR1.
#
# USE THIS ONE AT THIS SIZE. Everything in SLR0 would need ~580 of 672
# BRAM (86%), and that die stops working above ~85%: 5 x 4x4 at 92% fell
# to 260 MHz AND hung one tenant on the card, while the same design split
# (SLR0 at 69%) closed 329 MHz with all five tenants bit-exact.
#
# The 6 engines are 107,862 LUT and 186 BRAM together -- they fit one die
# easily. The movers stay in SLR0 beside the HBM they master, the broadcast
# pair with them; its 6 outputs cross to SLR1 like every mover's stream.
#
# SLR0 then holds the 26 movers and the platform: ~394 of 672 BRAM (59%).
# --------------------------------------------------------------------------

[connectivity]

# the broadcast pair: beside the HBM it reads
slr=mm2s_bcast_a0:SLR0
slr=mm2s_bcast_a1:SLR0

# tenant 0
slr=gemv_t0:SLR1
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=s2mm_c0_t0:SLR0

# tenant 1
slr=gemv_t1:SLR1
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=s2mm_c0_t1:SLR0

# tenant 2
slr=gemv_t2:SLR1
slr=mm2s_w0_t2:SLR0
slr=mm2s_w1_t2:SLR0
slr=mm2s_i0_t2:SLR0
slr=s2mm_c0_t2:SLR0

# tenant 3
slr=gemv_t3:SLR1
slr=mm2s_w0_t3:SLR0
slr=mm2s_w1_t3:SLR0
slr=mm2s_i0_t3:SLR0
slr=s2mm_c0_t3:SLR0

# tenant 4
slr=gemv_t4:SLR1
slr=mm2s_w0_t4:SLR0
slr=mm2s_w1_t4:SLR0
