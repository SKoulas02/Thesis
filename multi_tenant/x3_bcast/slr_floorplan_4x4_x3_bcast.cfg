# --------------------------------------------------------------------------
# slr_floorplan_4x4_x3_bcast.cfg -- every compute unit in SLR0.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   14 movers     196 BRAM  (4 per tenant + the broadcast pair, 14 each)
#   3 x engine     93 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 319 of SLR0's 672 tiles = 47%
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

[connectivity]

# the broadcast pair: beside the HBM it reads
slr=mm2s_bcast_a0:SLR0
slr=mm2s_bcast_a1:SLR0

# tenant 0
slr=gemv_t0:SLR0
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=s2mm_c0_t0:SLR0

# tenant 1
slr=gemv_t1:SLR0
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=s2mm_c0_t1:SLR0

# tenant 2
slr=gemv_t2:SLR0
slr=mm2s_w0_t2:SLR0
slr=mm2s_w1_t2:SLR0
slr=mm2s_i0_t2:SLR0
slr=s2mm_c0_t2:SLR0
