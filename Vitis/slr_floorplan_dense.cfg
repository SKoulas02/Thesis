# ----------------------------------------------------------------------------
# slr_floorplan_dense.cfg -- die assignment for the DENSE system.
#
# The dense counterpart of slr_floorplan.cfg, with dense's 14 CU names instead of
# sparse's 18. Same reasoning, same structure.
#
# Used as:
#   v++ -l --config dense_hbm.cfg --config impl_opt_perf.cfg \
#          --config slr_floorplan_dense.cfg --kernel_frequency 325 ...
#
# ---- WHY DENSE GETS THIS TOO ------------------------------------------------
# Dense closes 300 MHz WITHOUT a floorplan (+0.022 ns), so this is not needed at
# that clock. It exists because at 325 both designs need every lever, and because
# the comparison must stay fair: if sparse is floorplanned and dense is not, a
# reader can reasonably object that the two were not given equal effort.
#
# ---- THE ASSIGNMENT ---------------------------------------------------------
# Identical logic to the sparse case:
#
#   MOVERS -> SLR0. They are the only kernels with an m_axi port, and all 32 HBM
#   pseudo-channels are in SLR0. Each is ~1.5-2 kLUT, so 14 of them cost little.
#
#   GEMV -> SLR1. dense_gemv has NO m_axi -- it speaks only AXI4-Stream -- so
#   proximity to HBM buys it nothing. What it needs is to be WHOLE INSIDE ONE DIE.
#   At ~44 kLUT it is smaller than sparse's 66 kLUT and fits with room to spare.
#
#   SLR2 -> unused by our kernels. The platform still spans all three dice and
#   cannot be moved; those crossings are not ours.
#
# What still crosses: the 14 kernel-to-kernel links, all AXI4-Stream -- a
# handshake with tready backpressure, so extra crossing latency costs throughput
# nothing. On the sparse side this was measured: pinning ADDED 4,299 SLL
# crossings and timing IMPROVED, because the added traffic was the tolerant kind
# while the timing-critical logic became local.
#
# ---- IF PLACEMENT FAILS -----------------------------------------------------
# A too-tight assignment fails during place_design with an over-utilisation error
# naming the die. Recovery: delete the mover lines and pin only gemv -- the
# movers will follow their m_axi ports to SLR0 on their own.
# ----------------------------------------------------------------------------

[connectivity]

# ---- the compute engine: one die, to itself -------------------------------
slr=gemv:SLR1

# ---- the data movers: beside HBM ------------------------------------------
slr=mm2s_w0:SLR0
slr=mm2s_w1:SLR0
slr=mm2s_w2:SLR0
slr=mm2s_w3:SLR0
slr=mm2s_w4:SLR0
slr=mm2s_w5:SLR0
slr=mm2s_w6:SLR0
slr=mm2s_w7:SLR0

slr=mm2s_a0:SLR0
slr=mm2s_a1:SLR0

slr=s2mm_c0:SLR0
slr=s2mm_c1:SLR0
slr=s2mm_c2:SLR0
slr=s2mm_c3:SLR0
