# --------------------------------------------------------------------------
# slr_floorplan_8x8_x2_bcast.cfg -- every compute unit in SLR0.
#
# NOT USED BY THIS BUILD -- it uses slr_floorplan_8x8_x2_bcast_split.cfg.
# Kept for reference; the reasons are in that file.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   32 movers     448 BRAM  (15 per tenant + the broadcast pair, 14 each)
#   2 x engine    148 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 626 of SLR0's 672 tiles = 93%
#   ^^ ABOVE 85%: expect placement pressure. Use the _split variant.
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

