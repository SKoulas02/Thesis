# --------------------------------------------------------------------------
# slr_floorplan_16x3_x2_bcast_split.cfg -- the engines get SLR1.
#
# USE THIS ONE (chosen explicitly: --floorplan split).
#
# The 2 engines are 109,466 LUT and 120 BRAM together -- they fit one die
# easily. The movers stay in SLR0 beside the HBM they master, the broadcast
# pair with them; its 2 outputs cross to SLR1 like every mover's stream.
#
# SLR0 then holds the 24 movers and the platform: ~366 of 672 BRAM (54%).
# --------------------------------------------------------------------------

[connectivity]

# the broadcast pair: beside the HBM it reads
slr=mm2s_bcast_a0:SLR0
slr=mm2s_bcast_a1:SLR0

# tenant 0
slr=gemv_t0:SLR1
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_w2_t0:SLR0
slr=mm2s_w3_t0:SLR0
slr=mm2s_w4_t0:SLR0
slr=mm2s_w5_t0:SLR0
slr=mm2s_i0_t0:SLR0
slr=mm2s_i1_t0:SLR0
slr=s2mm_c0_t0:SLR0
slr=s2mm_c1_t0:SLR0
slr=s2mm_c2_t0:SLR0

# tenant 1
slr=gemv_t1:SLR1
slr=mm2s_w0_t1:SLR0
slr=mm2s_w1_t1:SLR0
slr=mm2s_w2_t1:SLR0
slr=mm2s_w3_t1:SLR0
slr=mm2s_w4_t1:SLR0
slr=mm2s_w5_t1:SLR0
slr=mm2s_i0_t1:SLR0
slr=mm2s_i1_t1:SLR0
slr=s2mm_c0_t1:SLR0
slr=s2mm_c1_t1:SLR0
slr=s2mm_c2_t1:SLR0
