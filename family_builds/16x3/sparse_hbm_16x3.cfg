# --------------------------------------------------------------------------
# sparse_hbm_16x3.cfg -- link configuration for the 16x3 configuration.
#
#   10 x krnl_mm2s  ->  krnl_gemv_sparse (free-running)  ->  3 x krnl_s2mm
#
# GENERATED by make_family_build.py. 16 cores x 3 blocks = 48 C Blocks,
# 384 DSPs, 96 MACs/cycle, 13 of the U280's 32 HBM pseudo-channels
# (6 weights + 2 indices + 2 activations in, 3 results out; 19 spare).
#
# SAME MOVER KERNELS AS EVERY OTHER CONFIG. krnl_mm2s / krnl_s2mm are
# unchanged and are not rebuilt -- an index PC is just another 256-bit stream
# to them. Only the COUNT changes.
#
# THE SPARSITY CODE IS NOT A STREAM. The 2-bit code rides in the LAST index
# PC's padding, bits [481:480] of the joined 512-bit index word (= s_axis_ind1 bits
# [225:224]). It is buffer CONTENT written by the Python packer; no mover, no
# link line and no host argument knows about it.
#
# Used as:  v++ -l --config sparse_hbm_16x3.cfg --config impl_family.cfg \
#                  --config slr_floorplan_16x3.cfg --kernel_frequency 350 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ---------------------------------------------------------
# Names are given explicitly. Without them every sp= and stream_connect= below
# would address krnl_mm2s_1 .. krnl_mm2s_10 by position, and one transposed
# digit would silently bind an index channel to a weight stream -- wrong
# answers, no error.
nk=krnl_mm2s:10:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_i0.mm2s_i1.mm2s_a0.mm2s_a1
nk=krnl_gemv_sparse:1:gemv
nk=krnl_s2mm:3:s2mm_c0.s2mm_c1.s2mm_c2

# ---- memory binding: one m_axi argument per pseudo-channel ------------------
# 'in' / 'out' are the kernel ARGUMENT names, not the bundle names.
sp=mm2s_w0.in:HBM[0]
sp=mm2s_w1.in:HBM[1]
sp=mm2s_w2.in:HBM[2]
sp=mm2s_w3.in:HBM[3]
sp=mm2s_w4.in:HBM[4]
sp=mm2s_w5.in:HBM[5]

sp=mm2s_i0.in:HBM[6]
sp=mm2s_i1.in:HBM[7]

sp=mm2s_a0.in:HBM[8]
sp=mm2s_a1.in:HBM[9]

sp=s2mm_c0.out:HBM[10]
sp=s2mm_c1.out:HBM[11]
sp=s2mm_c2.out:HBM[12]

# ---- kernel-to-kernel streams ----------------------------------------------
# Format: <producer_cu>.<out_port>:<consumer_cu>.<in_port>[:<fifo_depth>]
#
# WARNING: a mistyped port name here is a link WARNING, not an error. The
# stream is simply left dangling and the engine's barrier join waits forever
# for a channel that never arrives. If hw_emu hangs, check these first -- the
# join waits on ALL 8 weight+index PCs, so a single dangling index stream
# hangs the whole engine with no other symptom.
#
# The port names on the gemv side are two2N_axis's entity ports -- s_axis_ind0
# not s_axis_i0. The mover CU names are abbreviated (mm2s_i0); the kernel port
# names are not. Do not "tidy" one to match the other.
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5

stream_connect=mm2s_i0.out:gemv.s_axis_ind0
stream_connect=mm2s_i1.out:gemv.s_axis_ind1

stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in

# ---- kernel clock ----------------------------------------------------------
# NOT SET HERE. A [clock] section maps to v++ --clock, which this platform
# rejects (xilinx_u280_xdma_201920_3 has no fixed reference clocks). Use
#     v++ -l ... --kernel_frequency 350
# OOC Fmax for this config was 501.8 MHz on the bare engine at 1.5 ns; the
# in-system target above de-rates that by the ratio MEASURED on 8x8
# (325 in-system / 448.6 OOC = 0.724), rounded down to a round number.
