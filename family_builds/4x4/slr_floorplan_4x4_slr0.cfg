# --------------------------------------------------------------------------
# slr_floorplan_4x4_slr0.cfg -- SINGLE-DIE variant for the 4x4 configuration.
#
# WHY THIS EXISTS. The 400 MHz build with the SPLIT floorplan (gemv->SLR1,
# movers->SLR0) missed by 48 ps. The worst path, from the routed report:
#
#   Source:      mm2s_i0/.../regslice_both_out_V_data_V_U/B_V_data_1_sel_rd_reg
#   Destination: gemv/.../WEIGHTS_FIFO_INST/IND_FIFOS[0]/.../mem_reg_0
#   Data Path Delay: 1.842ns  (logic 0.179ns 9.7%, route 1.663ns 90.3%)
#   Logic Levels:    1  (LUT3=1)
#   Inter-SLR Compensation: 0.222ns
#
# ONE LUT3, 90% of its delay on wire, and the SLR-crossing penalty alone is
# 0.222 ns -- 4.6x the violation. The index mover is reaching across the die
# boundary into the engine's index FIFO.
#
# THE SPLIT FLOORPLAN WAS RIGHT FOR 8x8 AND IS WRONG HERE. It was designed for
# a 66,186-LUT engine and 17 CUs that genuinely needed a die each. Measured 4x4
# (impl_1_kernel_util_routed.rpt):
#
#     gemv            17,988 LUT [1.51%]   31 BRAM   128 DSP
#     5 mm2s + s2mm   10,377 LUT [0.87%]   84 BRAM     0 DSP
#     TOTAL          ~28,000 LUT [2.4% of the device]  115 BRAM
#
# The whole design is 2.4% of the chip. Splitting it across two dice buys six
# SLL crossings and pays 0.222 ns on the critical one, for nothing.
#
# THE BRAM OBJECTION DOES NOT APPLY AT THIS SIZE. slr_floorplan.cfg warned that
# moving gemv to SLR0 'drives SLR0 to ~77% BRAM in the same die that carries the
# HBM interconnect'. That was true at 8x8 (74 BRAM engine + 17 movers). Here the
# entire design needs 115 BRAM against SLR0's 720, with the platform's ~204 on
# top -- about 44%.
#
# POLICY, NOT AN AD-HOC FIX: keep the design in ONE die while it fits, split it
# when it does not. impl_family.cfg (the strategy) stays byte-identical across
# all six configurations; the floorplan was always per-config. Where the
# crossover falls is itself a result worth reporting.
#
# Used as:
#   v++ -l --config sparse_hbm_4x4.cfg --config impl_family.cfg \
#          --config slr_floorplan_4x4_slr0.cfg --kernel_frequency 400 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- everything in SLR0: zero SLL crossings, engine beside its movers -------
slr=gemv:SLR0

slr=mm2s_w0:SLR0
slr=mm2s_w1:SLR0

slr=mm2s_i0:SLR0

slr=mm2s_a0:SLR0
slr=mm2s_a1:SLR0

slr=s2mm_c0:SLR0
