# ----------------------------------------------------------------------------
# slr_floorplan.cfg -- pin each compute unit to a die.
#
# THIRD config file, kept separate from sparse_hbm.cfg (what is connected to
# what) and impl_opt.cfg (how hard the tools try). One variable per file, so a
# build differs from its predecessor in exactly one place.
#
# Used as:
#   v++ -l --config sparse_hbm.cfg --config impl_opt.cfg --config slr_floorplan.cfg ...
#
# ---- WHY --------------------------------------------------------------------
# Measured on the 300 MHz + fanout-fix build (impl_1_slr_util_routed.rpt):
#
#     SLR2 <-> SLR1 : 3,995 SLLs
#     SLR1 <-> SLR0 : 2,554 SLLs
#     Total         : 6,549      -- the design was spread over ALL THREE dice
#
# and the worst path was one LUT6 with fanout 7 taking 3.955 ns, of which 3.839
# ns (97%) was route. One logic level spending 97% of its time on wire is a
# placement statement, not a logic or fanout statement. The RTL fanout fix
# (c_core_4.0.vhd A_internal attributes) already removed the broadcast from the
# critical path; this is the next lever.
#
# ---- THE ASSIGNMENT ---------------------------------------------------------
# Per-kernel sizes from impl_1_kernel_util_routed.rpt:
#
#     gemv           66,186 LUT   74 BRAM   512 DSP   <- ~15% of ONE SLR
#     13 x mm2s      19,646 LUT  176 BRAM     0 DSP
#     4  x s2mm       8,210 LUT   64 BRAM     0 DSP
#     platform      123,863 LUT  204 BRAM     4 DSP   <- fixed, mostly SLR0
#
# MOVERS -> SLR0. They are the only kernels with an m_axi port, and all 32 HBM
# pseudo-channels are in SLR0. They are also tiny (~1.5-2 kLUT each), so 17 of
# them cost SLR0 almost nothing.
#
# GEMV -> SLR1. It has NO m_axi -- it speaks only AXI4-Stream -- so proximity to
# HBM buys it nothing. What it needs is to be WHOLE INSIDE ONE DIE so the
# 32-element activation broadcast never crosses silicon. At 66 kLUT it occupies
# ~15% of SLR1, with the die essentially to itself.
#
# SLR2 -> unused. Emptying the die furthest from HBM removes the largest single
# source of crossings (3,995 SLLs).
#
# WHAT STILL CROSSES, AND WHY THAT IS FINE: the 17 kernel-to-kernel links,
# ~4,450 SLLs of 23,040 available (19%). Every one is AXI4-Stream -- a
# handshake with tready backpressure -- so an extra cycle or two of crossing
# latency costs throughput nothing. Vitis inserts SLL pipeline registers
# automatically. This deliberately puts the latency-TOLERANT traffic on the die
# boundary and keeps the timing-critical logic local, which is the opposite of
# what the unconstrained placer did.
#
# ---- THE ALTERNATIVE, IF THIS IS NOT ENOUGH ---------------------------------
# Move gemv to SLR0 as well (change the one line below). That gives ZERO SLL
# crossings, but drives SLR0 to ~77% BRAM in the same die that carries the HBM
# interconnect -- trading a measured problem for a plausible one in a design
# that is already routing-limited. Worth trying second, not first.
#
# ---- IF PLACEMENT FAILS -----------------------------------------------------
# A too-tight SLR assignment fails during place_design, an hour or two in, with
# an over-utilisation error naming the die. If that happens, relax by removing
# the mover lines and pinning only gemv -- the movers will follow their HBM
# ports to SLR0 on their own.
# ----------------------------------------------------------------------------

[connectivity]

# ---- the compute engine: one die, to itself -------------------------------
slr=gemv:SLR1

# ---- the data movers: beside HBM ------------------------------------------
slr=mm2s_w0:SLR0
slr=mm2s_w1:SLR0
slr=mm2s_w2:SLR0
slr=mm2s_w3:SLR0
slr=mm2s_w4:SLR0
slr=mm2s_w5:SLR0
slr=mm2s_w6:SLR0
slr=mm2s_w7:SLR0

slr=mm2s_i0:SLR0
slr=mm2s_i1:SLR0
slr=mm2s_i2:SLR0

slr=mm2s_a0:SLR0
slr=mm2s_a1:SLR0

slr=s2mm_c0:SLR0
slr=s2mm_c1:SLR0
slr=s2mm_c2:SLR0
slr=s2mm_c3:SLR0
