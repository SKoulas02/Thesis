# --------------------------------------------------------------------------
# sparse_hbm_4x24.cfg -- link configuration for the 4x24 configuration.
#
#   18 x krnl_mm2s  ->  krnl_gemv_sparse (free-running)  ->  6 x krnl_s2mm
#
# GENERATED by make_family_build.py. 4 cores x 24 blocks = 96 C Blocks,
# 768 DSPs, 192 MACs/cycle, 24 of the U280's 32 HBM pseudo-channels
# (12 weights + 4 indices + 2 activations in, 6 results out; 8 spare).
#
# SAME MOVER KERNELS AS EVERY OTHER CONFIG. krnl_mm2s / krnl_s2mm are
# unchanged and are not rebuilt -- an index PC is just another 256-bit stream
# to them. Only the COUNT changes.
#
# THE SPARSITY CODE IS NOT A STREAM. The 2-bit code rides in the LAST index
# PC's padding, bits [961:960] of the joined 1024-bit index word (= s_axis_ind3 bits
# [193:192]). It is buffer CONTENT written by the Python packer; no mover, no
# link line and no host argument knows about it.
#
# Used as:  v++ -l --config sparse_hbm_4x24.cfg --config impl_family.cfg \
#                  --config slr_floorplan_4x24.cfg --kernel_frequency 300 ...
# --------------------------------------------------------------------------

[connectivity]

# ---- compute units ---------------------------------------------------------
# Names are given explicitly. Without them every sp= and stream_connect= below
# would address krnl_mm2s_1 .. krnl_mm2s_18 by position, and one transposed
# digit would silently bind an index channel to a weight stream -- wrong
# answers, no error.
nk=krnl_mm2s:18:mm2s_w0.mm2s_w1.mm2s_w2.mm2s_w3.mm2s_w4.mm2s_w5.mm2s_w6.mm2s_w7.mm2s_w8.mm2s_w9.mm2s_w10.mm2s_w11.mm2s_i0.mm2s_i1.mm2s_i2.mm2s_i3.mm2s_a0.mm2s_a1
nk=krnl_gemv_sparse:1:gemv
nk=krnl_s2mm:6:s2mm_c0.s2mm_c1.s2mm_c2.s2mm_c3.s2mm_c4.s2mm_c5

# ---- memory binding: one m_axi argument per pseudo-channel ------------------
# 'in' / 'out' are the kernel ARGUMENT names, not the bundle names.
sp=mm2s_w0.in:HBM[0]
sp=mm2s_w1.in:HBM[1]
sp=mm2s_w2.in:HBM[2]
sp=mm2s_w3.in:HBM[3]
sp=mm2s_w4.in:HBM[4]
sp=mm2s_w5.in:HBM[5]
sp=mm2s_w6.in:HBM[6]
sp=mm2s_w7.in:HBM[7]
sp=mm2s_w8.in:HBM[8]
sp=mm2s_w9.in:HBM[9]
sp=mm2s_w10.in:HBM[10]
sp=mm2s_w11.in:HBM[11]

sp=mm2s_i0.in:HBM[12]
sp=mm2s_i1.in:HBM[13]
sp=mm2s_i2.in:HBM[14]
sp=mm2s_i3.in:HBM[15]

sp=mm2s_a0.in:HBM[16]
sp=mm2s_a1.in:HBM[17]

sp=s2mm_c0.out:HBM[18]
sp=s2mm_c1.out:HBM[19]
sp=s2mm_c2.out:HBM[20]
sp=s2mm_c3.out:HBM[21]
sp=s2mm_c4.out:HBM[22]
sp=s2mm_c5.out:HBM[23]

# ---- kernel-to-kernel streams ----------------------------------------------
# Format: <producer_cu>.<out_port>:<consumer_cu>.<in_port>[:<fifo_depth>]
#
# WARNING: a mistyped port name here is a link WARNING, not an error. The
# stream is simply left dangling and the engine's barrier join waits forever
# for a channel that never arrives. If hw_emu hangs, check these first -- the
# join waits on ALL 16 weight+index PCs, so a single dangling index stream
# hangs the whole engine with no other symptom.
#
# The port names on the gemv side are two2N_axis's entity ports -- s_axis_ind0
# not s_axis_i0. The mover CU names are abbreviated (mm2s_i0); the kernel port
# names are not. Do not "tidy" one to match the other.
stream_connect=mm2s_w0.out:gemv.s_axis_w0
stream_connect=mm2s_w1.out:gemv.s_axis_w1
stream_connect=mm2s_w2.out:gemv.s_axis_w2
stream_connect=mm2s_w3.out:gemv.s_axis_w3
stream_connect=mm2s_w4.out:gemv.s_axis_w4
stream_connect=mm2s_w5.out:gemv.s_axis_w5
stream_connect=mm2s_w6.out:gemv.s_axis_w6
stream_connect=mm2s_w7.out:gemv.s_axis_w7
stream_connect=mm2s_w8.out:gemv.s_axis_w8
stream_connect=mm2s_w9.out:gemv.s_axis_w9
stream_connect=mm2s_w10.out:gemv.s_axis_w10
stream_connect=mm2s_w11.out:gemv.s_axis_w11

stream_connect=mm2s_i0.out:gemv.s_axis_ind0
stream_connect=mm2s_i1.out:gemv.s_axis_ind1
stream_connect=mm2s_i2.out:gemv.s_axis_ind2
stream_connect=mm2s_i3.out:gemv.s_axis_ind3

stream_connect=mm2s_a0.out:gemv.s_axis_a0
stream_connect=mm2s_a1.out:gemv.s_axis_a1

stream_connect=gemv.m_axis_c0:s2mm_c0.in
stream_connect=gemv.m_axis_c1:s2mm_c1.in
stream_connect=gemv.m_axis_c2:s2mm_c2.in
stream_connect=gemv.m_axis_c3:s2mm_c3.in
stream_connect=gemv.m_axis_c4:s2mm_c4.in
stream_connect=gemv.m_axis_c5:s2mm_c5.in

# ---- kernel clock ----------------------------------------------------------
# NOT SET HERE. A [clock] section maps to v++ --clock, which this platform
# rejects (xilinx_u280_xdma_201920_3 has no fixed reference clocks). Use
#     v++ -l ... --kernel_frequency 300
# OOC Fmax for this config was 407.3 MHz on the bare engine at 1.5 ns; the
# in-system target above de-rates that by the ratio MEASURED on 8x8
# (325 in-system / 448.6 OOC = 0.724), rounded down to a round number.
