# ----------------------------------------------------------------------------
# profile.cfg -- hardware profiling monitors (S31b), for a SEPARATE xclbin.
#
# WHAT THIS BUYS. Right now the statement "the DSPs are idle 3-5% of the time"
# is DERIVED: occupancy = ideal_beats/clock divided by (measured latency minus a
# fitted launch overhead). It is sound arithmetic, but it is arithmetic. These
# monitors MEASURE it, and they say WHERE the cycles go:
#
#   data=all:all:all   AIM on every m_axi port -> bytes, transactions and
#                      latency PER HBM PSEUDO-CHANNEL. Answers "are the 11 input
#                      PCs actually balanced, or is one mover the limiter?"
#
#                      ASM on every kernel-to-kernel stream -> transfer counts
#                      plus STALL and STARVE cycles per stream. This is the
#                      valuable one. It separates the two candidate explanations
#                      for beats/cycle sitting at 0.95-0.97 instead of 1.00:
#                        STARVE on the weight streams  = the movers cannot keep
#                                                        the engine fed (HBM side)
#                        STALL  on the output streams  = c_fifo prog_full is
#                                                        gating the cores (write side)
#                      One of those is the residual, and no amount of host-side
#                      timing can tell them apart.
#
#   exec=all:all       AM per CU -> real per-CU execution time, rather than the
#                      earliest-start-to-latest-end span the host computes.
#
# DELIBERATELY OMITTED: stall=all:all. Stall monitors instrument HLS-generated
# stall signals; `gemv` is an RTL kernel, so the option is at best a no-op there
# and at worst a link error. The ASM stall/starve counters from `data` cover the
# RTL kernel's interfaces, which is what we actually need. Add stall=... scoped
# to the movers only (krnl_mm2s:all) if the HLS-internal picture is ever wanted.
#
# ---- THE TIMING RISK, WHICH IS REAL ----------------------------------------
# 14 AIMs + 14 ASMs + 15 AMs is real logic, inserted on the AXI paths -- exactly
# the congested region. The clean sparse build closes 300 MHz at WNS **0.000 ns**:
# zero margin. This build will very probably MISS 300 MHz. That is expected and
# is not a failure of the experiment.
#
#   Plan A: link at 300. If it closes, the numbers line up with the clean build.
#   Plan B: if it misses, relink at 250 with --kernel_frequency 250. STALL AND
#           STARVE ARE RATIOS -- "the weight streams starve 4% of cycles" is a
#           statement about the dataflow, not about the clock, so it stays valid.
#           Do NOT quote throughput or latency from the profiling build.
#
# ---- THE RULE, AND IT MATTERS ----------------------------------------------
# TWO XCLBINS, TWO ROLES, NEVER MIXED:
#   clean build      -> area, Fmax, timing, latency, GFLOPS, power, energy
#   profiling build  -> per-PC bandwidth, stall/starve, per-CU time
# Say which build produced which number in the thesis. A profiling xclbin has
# different logic, possibly a different clock, and is a different design.
#
# ---- XRT SCHEMA CAVEAT ------------------------------------------------------
# This machine is Vitis 2021.1 with XRT 2.13 (branch 2022.1) -- straddling the
# release where the xrt.ini profiling group was renamed. AN UNRECOGNISED KEY IS
# IGNORED SILENTLY, and a missing trace file looks exactly like "the kernel was
# too fast to capture". `Vitis/xrt.ini` is already written with that caveat in
# its header. After the first run, CHECK that the profile summary is non-empty
# and that the ASM rows exist before drawing any conclusion from them.
#
# ---- USE -------------------------------------------------------------------
#   v++ -l --config sparse_hbm.cfg --config impl_opt.cfg \
#          --config slr_floorplan.cfg --config profile.cfg \
#          --kernel_frequency 300 -o gemv_sparse_profile.xclbin ...
#
# Build into a SEPARATE directory (Vitis_profile/) with a SEPARATE output name.
# Do not overwrite gemv_sparse_slr.xclbin -- every measured number in the thesis
# comes from that file.
#
# Expect 3-5 hours. Run it in tmux.
# ----------------------------------------------------------------------------

[profile]

# AIM on m_axi ports + ASM on kernel-to-kernel streams
data=all:all:all

# AM per compute unit
exec=all:all
