# --------------------------------------------------------------------------
# slr_floorplan_16x3_x2.cfg -- every compute unit in SLR0.
#
# NOT USED BY THIS BUILD -- it uses slr_floorplan_16x3_x2_split.cfg.
# Kept for reference; the reasons are in that file.
#
# THE DEFAULT, for the same reason it is the default at 4x4: a single
# tenant measured WORSE when split (WNS -0.048 with the engine in SLR1,
# +0.022 with everything in SLR0 -- the SLR crossing cost 0.222 ns on a
# ONE-LUT path). Keep every tenant whole, beside its own movers.
#
# ---- BRAM BUDGET IN SLR0 ------------------------------------------
#   2 x movers    364 BRAM  (5 mm2s + 1 s2mm per tenant, measured)
#   2 x engine    120 BRAM  (measured)
#   platform       ~30 BRAM in SLR0
#   TOTAL         ~ 514 of SLR0's 672 tiles = 76%
#   (SLR0 has 672 BRAM tiles, not 720 -- measured, not from the
#    datasheet's device total.)
# --------------------------------------------------------------------------

[connectivity]

# tenant 0
slr=gemv_t0:SLR0
slr=mm2s_w0_t0:SLR0
slr=mm2s_w1_t0:SLR0
slr=mm2s_w2_t0:SLR0
